# Nav2 для GIGAROVER — первичная прикидка (не тюнинговалось на роботе).
# Копия параметров малого ровера с очевидным масштабированием:
# footprint под шасси 0.45 м (колёса выступают: полудлина 0.34, полуширина 0.25),
# max_vel_x 1.0, max_vel_theta 2.0, ускорения ~1.2/1.5, inflation_radius 0.55.
# Скид-стир: боковой скорости нет (vy=0), модель движения — дифференциальная.
# Нижние пороги вращения (min_speed_theta, min_rotational_vel) подняты до
# 0.5 рад/с: VESC в режиме RPM не держит ~50 eRPM (медленный доворот на месте
# просто стопорится на скиде), 0.5 рад/с -> 0.1 м/с колеса -> ~240 eRPM.
# Уточнить на роботе минимальный удерживаемый eRPM и опустить пороги к нему.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    # Скид-стир кинематически эквивалентен дифференциальному приводу.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: /scan_filtered
    map_topic: /map
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: -1.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.05
    update_min_a: 0.05
    transform_tolerance: 0.5
    tf_broadcast: true
    do_beamskip: false
    set_initial_pose: false
    always_reset_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    odom_topic: /odom
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.06
      movement_time_allowance: 12.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.07
      # ~5.7 град: с порогом вращения 0.5 рад/с более узкий допуск по курсу
      # приводит к перерегулированию при довороте на месте.
      yaw_goal_tolerance: 0.10
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.50
      max_vel_x: 1.0
      # Скид-стир: боковой скорости нет.
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 2.0
      # Пара min_speed_xy/min_speed_theta отсекает "ползущие" команды, которые
      # VESC RPM-PID не держит: команда отклоняется, только если ОБЕ скорости
      # ниже порогов (доворот на месте идёт не медленнее 0.5 рад/с).
      min_speed_xy: 0.1
      max_speed_xy: 1.0
      min_speed_theta: 0.5
      # Согласовано со slew-лимитом VESC-драйвера (1.5/3.0 м/с^2 на колесо):
      # худший случай на колесо = acc_lim_x + acc_lim_theta * track/2
      # = 1.2 + 1.5 * 0.2 = 1.5 (торможение: 2.4 + 3.0 * 0.2 = 3.0).
      acc_lim_x: 1.2
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -2.4
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.07
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Габарит с колёсами: 0.68 x 0.50 м (первичная прикидка).
      footprint: "[[0.34, 0.25], [0.34, -0.25], [-0.34, -0.25], [-0.34, 0.25]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.15
          raytrace_max_range: 8.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # Габарит с колёсами: 0.68 x 0.50 м (первичная прикидка).
      footprint: "[[0.34, 0.25], [0.34, -0.25], [-0.34, -0.25], [-0.34, 0.25]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.15
          raytrace_max_range: 8.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.10
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 1.5
    max_rotational_vel: 2.0
    # Ниже 0.5 рад/с (~240 eRPM) VESC не держит обороты — Spin застревает.
    min_rotational_vel: 0.5
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
