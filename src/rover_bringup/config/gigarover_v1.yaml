# GIGAROVER v1 — конфигурация робота (4x VESC на общей CAN-шине, skid-steer).
# Все значения с пометкой "калибровка" — первичная прикидка, уточняются на роботе.

robot:
  id: gigarover-01
  hostname: gigarover-01
  company: Сверх
  model: gigarover-v1
  serial_number: GGR-0001
  software_version: 0.1.0
  web_interface_version: 0.1.0

geometry:
  # Геометрия шасси — калибровка: перемерить на собранном роботе.
  wheel_radius_m: 0.0825
  wheel_width_m: 0.05
  wheelbase_m: 0.50
  track_width_m: 0.40
  chassis_length_m: 0.45
  chassis_width_m: 0.45
  chassis_height_m: 0.12
  chassis_xyz:
  - 0.0
  - 0.0
  - 0.0
  # Позиция IMU — калибровка: задать после физической установки датчика.
  imu_xyz:
  - 0.0
  - 0.0
  - 0.0
  imu_rpy:
  - 0.0
  - 0.0
  - 0.0
  # Позиция лидара — калибровка: задать после физической установки.
  lidar_xyz:
  - 0.0
  - 0.0
  - 0.15
  lidar_rpy:
  - 0.0
  - 0.0
  - 0.0

encoders:
  # Единый источник правды для драйвера и колёсной одометрии.
  # ОТКАЛИБРОВАНО 28.07.2026 ручным прокатом на 1.00 м: 571.5 отсчёта
  # тахометра на метр пути (по колёсам 564/546/588/588), т.е. 296.25 отсчёта
  # на оборот колеса при r=82.5 мм. Паспортное разложение «6 x 7 полюсов x
  # ремень 3.0» (= 243 отсч/м) не соответствует фактическому приводу
  # (мотор 7490 + редуктор) — ошибка одометрии была 2.35x.
  # Здесь encoder_lines/reduction_ratio — эффективные значения, важно их
  # произведение: 96 x 3.086 = 296.25. encoder_lines кратно 6, потому что
  # motord выводит pole_pairs = encoder_lines/6 (целое). Уточнить физическое
  # разложение можно, крутнув вывешенное колесо ровно на 1 оборот.
  encoder_lines: 96.0
  reduction_ratio: 3.086
  quadrature_factor: 1.0

base_driver:
  type: vesc
  can_interface: seeedstudio
  can_channel: ''      # ''=автопоиск CH340; перекрывается ~/rover_config/motors.yaml
  can_bitrate: 500000
  # Порядок колёс: FL, FR, RL, RR. Значения со стенда; перекрываются motors.yaml.
  wheel_can_ids: [57, 25, 92, 71]
  wheel_inverts: [true, true, false, false]
  max_erpm: 4000
  # Подпор выше foc_sl_erpm=1400 (детекция 28.07): ниже ~1400 sensorless
  # ловит зеркальный захват (FR крутился в обратную сторону на 1215).
  min_erpm: 1500
  max_wheel_speed_mps: 1.6
  max_wheel_accel_mps2: 1.5
  idle_mode: coast
  battery_cells: 6

wheel_odometry:
  x_multiplier: 1.0
  y_multiplier: 1.0
  # Калибровка 28.07.2026. Длинное вращение на месте (30 с, факт 1575° при
  # 1508° сырых) => 1.045; короткие повороты ~90° => ~0.97 (одометрия чуть
  # завышает). Проскальзывание зависит от режима — компромисс 1.0 внутри
  # погрешности обоих. Точный курс на скиде даст только IMU. На новом
  # покрытии перепроверять тестом «полный оборот на месте».
  yaw_multiplier: 1.0
  # Должно быть выше max_wheel_speed_mps драйвера (1.6), иначе на полной
  # скорости одометрия отбрасывает валидные отсчёты энкодеров.
  max_plausible_wheel_speed_mps: 2.0

imu:
  # Калибровка: проверить оси после установки IMU.
  axis_map:
  - 0
  - 1
  - 2
  axis_signs:
  - 1
  - 1
  - 1

navigation:
  # Первичная прикидка параметров навигации под шасси 0.45 м.
  nav2_params_file: navigation/nav2_params_gigarover.yaml
  slam_params_file: navigation/slam_toolbox_params_gigarover.yaml
