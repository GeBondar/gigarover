camera:
  device: /dev/video0
  frame_id: camera_optical_frame
  width: 640
  height: 480
  fps: 30.0
  use_mjpeg: true
  jpeg_quality: 85
  reconnect_interval_sec: 2.0
  get_frame_service: get_frame
  ws_bind_address: 0.0.0.0
  ws_port: 8766
  # Topic republisher (ws_image_publisher_node) settings:
  image_topic: /image_raw
  compressed_image_topic: /image_raw/compressed
  publish_raw: true
  publish_compressed: true
