waveshare_audio:
  serial_device: /dev/waveshare_audio
  baudrate: 2000000
  read_timeout_sec: 1.0
  reconnect_interval_sec: 2.0
  expected_sample_rate: 16000
  expected_frame_samples: 320
  output_topic: /voice/text
  status_topic: /waveshare_audio/status
  transcript_json_topic: /voice/transcript
  publish_transcript_json: true
  whisper_model: base
  language: ru
  device: auto
  condition_on_previous_text: false
  temperature: 0.0
  min_rms: 350.0
  start_frames: 3
  stop_frames: 35
  pre_roll_frames: 8
  max_utterance_seconds: 12.0
  utterance_queue_size: 4
  save_wavs_dir: ''
  append_file: ''
  jsonl_file: ''
  tcp_sink: ''
  serial_sink_device: ''
  serial_sink_baudrate: 115200
  enable_tts: true
  tts_service_name: /voice/say
  tts_engine: piper
  tts_voice: ''
  tts_rate: 175
  tts_target_peak: 28000.0
  tts_gain_limit: 4.0
  tts_queue_size: 4
  save_tts_wavs_dir: ''
  piper_module: piper
  piper_model: ru_RU-irina-medium
  piper_data_dir: ~/sverk_rover/tts_voices

