# motors.yaml - generated by rover_setup_web
# Maps each wheel position to its VESC CAN id and forward direction.
can:
  interface: seeedstudio
  channel: COM16    # override on the robot, e.g. /dev/ttyUSB0
  bitrate: 500000
wheels:
  front_left: { can_id: 114, invert: true }
  front_right: { can_id: 104, invert: false }
  rear_left: { can_id: 32, invert: true }
  rear_right: { can_id: 34, invert: false }
